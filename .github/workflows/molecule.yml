---
name: Ansible Molecule
true:
  pull_request:
    branches:
    - master
    - main
  push:
    branches:
    - master
    - main
  schedule:
  - cron: 23 12 12 * *
  workflow_dispatch:
concurrency:
  cancel-in-progress: true
  group: ${{ github.ref }}-${{ github.workflow }}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v6
    - name: ansible-lint
      uses: ansible/ansible-lint@v26.1.1
  molecule:
    needs:
    - lint
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v6
      with:
        path: ansible-role-lemp-stack
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Configure Docker for systemd
      run: "sudo mkdir -p /etc/docker\necho '{\n  \"features\": {\n    \"buildkit\"\
        : true\n  },\n  \"exec-opts\": [\"native.cgroupdriver=systemd\"]\n}' | sudo
        tee /etc/docker/daemon.json\nsudo systemctl restart docker || true\n"
    - name: Install Docker
      uses: docker/setup-buildx-action@v3
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip3 install ansible molecule molecule-plugins[docker] docker

        '
    - env:
        ANSIBLE_FORCE_COLOR: 1
        ANSIBLE_ROLES_PATH: 
          ~/.ansible/roles:${GITHUB_WORKSPACE}/ansible-role-lemp-stack
        PY_COLORS: 1
        image: ${{ matrix.distro.image }}
        tag: ${{ matrix.distro.tag }}
      name: Test with molecule
      run: 'cd ansible-role-lemp-stack

        molecule test

        '
    strategy:
      fail-fast: false
      matrix:
        distro:
        - image: enterpriselinux
          tag: '8'
        - image: enterpriselinux
          tag: latest
