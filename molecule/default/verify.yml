---
- name: Verify
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Check nginx is running
      ansible.builtin.service_facts:

    - name: Assert nginx is active
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts.services or 'nginx' in ansible_facts.services"
          - >-
            ansible_facts.services.get('nginx.service',
            ansible_facts.services.get('nginx', {})).state == 'running'
        quiet: true
