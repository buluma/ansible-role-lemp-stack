---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    role-file: requirements.yml
driver:
  name: docker
lint: 'set -e

  yamllint .

  ansible-lint

  '
platforms:
- cgroupns_mode: host
  command: /sbin/init
  image: ${namespace:-buluma}/${image:-fedora}:${tag:-latest}
  name: lemp-stack-${image:-fedora}-${tag:-latest}
  pre_build_image: true
  privileged: true
  volumes:
  - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
