---
- name: nginx | Install nginx
  notify:
    - Restart nginx
  # Separator for the pre-commit handler parser.
  ansible.builtin.dnf:
    name: nginx
    state: present
- name: nginx | Enable and start nginx
  ansible.builtin.service:
    enabled: true
    name: nginx
    state: started
- name: nginx | Make /var/lib/nginx/cache directory
  ansible.builtin.file:
    group: nginx
    mode: "0700"
    owner: nginx
    path: /var/lib/nginx/cache
    state: directory
  notify:
    - Restart nginx
# Separator for the pre-commit handler parser.
- name: nginx | Make /etc/nginx/ssl directory
  ansible.builtin.file:
    group: nginx
    mode: "0700"
    owner: nginx
    path: /etc/nginx/ssl
    state: directory
  notify:
    - Restart nginx
  # Separator for the pre-commit handler parser.
