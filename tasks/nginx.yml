---
- name: nginx | Install nginx
  notify:
    - Restart nginx
  # Separator for the pre-commit handler parser.
  ansible.builtin.package:
    name: nginx
    state: present
- name: nginx | Make /var/lib/nginx/cache directory
  ansible.builtin.file:
    group: "{{ lemp_nginx_user }}"
    mode: "0700"
    owner: "{{ lemp_nginx_user }}"
    path: /var/lib/nginx/cache
    state: directory
  notify:
    - Restart nginx
# Separator for the pre-commit handler parser.
- name: nginx | Make /etc/nginx/ssl directory
  ansible.builtin.file:
    group: "{{ lemp_nginx_user }}"
    mode: "0700"
    owner: "{{ lemp_nginx_user }}"
    path: /etc/nginx/ssl
    state: directory
  notify:
    - Restart nginx
  # Separator for the pre-commit handler parser.
- name: nginx | Start nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
