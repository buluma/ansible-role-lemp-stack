---
- name: sendmail | Install Sendmail
  ansible.builtin.package:
    name: "{{ lemp_mail_packages }}"
    state: present
- name: sendmail | Remove Postfix
  ansible.builtin.package:
    name: postfix
    state: absent
- name: sendmail | Copy Sendmail config
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.copy:
    dest: /etc/mail/aliases
    mode: preserve
    remote_src: true
    src: /etc/aliases
- name: sendmail | Enable Sendmail service
  ansible.builtin.service:
    enabled: true
    name: sendmail
