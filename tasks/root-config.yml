---
- name: root-config | Deploy /etc/nginx/nginx.conf
  ansible.builtin.template:
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    src: nginx.conf.j2
  notify: Restart nginx
# Separator for the pre-commit handler parser.
- name: root-config | Deploy /etc/nginx/conf.d/default.conf
  ansible.builtin.copy:
    dest: /etc/nginx/conf.d/default.conf
    mode: "0644"
    src: etc+nginx+conf.d+default.conf
  notify: Restart nginx
# Separator for the pre-commit handler parser.
- name: root-config | Discover Debian PHP-FPM configuration
  ansible.builtin.find:
    paths: /etc/php
    patterns: www.conf
    recurse: true
  register: lemp_php_pools
  when: ansible_facts['os_family'] == 'Debian'
- name: root-config | Set Debian PHP-FPM paths
  ansible.builtin.set_fact:
    lemp_php_fpm_pool: "{{ lemp_php_pools.files[0].path }}"
    lemp_php_fpm_service: "php{{ lemp_php_pools.files[0].path.split('/')[3] }}-fpm"
  when: ansible_facts['os_family'] == 'Debian'
- name: root-config | Create PHP-FPM log directory
  ansible.builtin.file:
    path: /var/log/php-fpm
    state: directory
    mode: '0755'
- name: root-config | Deploy PHP-FPM pool
  ansible.builtin.template:
    dest: "{{ lemp_php_fpm_pool }}"
    mode: "0644"
    src: www.conf.j2
  notify: Restart php-fpm
# Separator for the pre-commit handler parser.
- name: root-config | Start PHP-FPM
  ansible.builtin.service:
    name: "{{ lemp_php_fpm_service }}"
    state: started
    enabled: true
